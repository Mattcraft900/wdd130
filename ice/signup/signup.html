<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            position: relative;
            margin: 30px auto;
            background-color: white;
            border: 8px solid #0d2e7c;
            border-radius: 30px;
            overflow: hidden;
            max-width: 400px;
        }

        #imgContainer {
            width: 100%;
            height: 170px;
        }

        #title-bg {
            width: 100%;
            height: 170px;
            object-fit: cover;
            object-position: top;
            z-index: 0;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-align: center;
        }

        #title-box {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            grid-template-columns: 100%;
            grid-template-rows: repeat(5, 34px);
            color: white;
            text-shadow: 1.5px 1.5px black;
            text-align: center;
        }

        #title-box h1 {
            grid-row: 3/1/4/2;
            z-index: 1;
        }

        #title-box h2 {
            grid-row: 4/1/5/2;
            z-index: 1;
            font-weight: normal;
            font-size: 27px;
        }

        h3 { 
            margin: 20px;
            text-align: center;
            text-shadow: 0 0 1px black;
        }

        #myForm {
            margin: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 10px;
            align-items: center;
        }

        #myForm>label {
            text-align: left;
        }

        #myForm>input {
            text-align: right;
            margin: 5px 0;
        }

        #myForm>section {
            grid-column: 1/3;
            margin: 5px;
            text-align: center;
        }

        #myForm button {
            padding: 2px 8px;
        }

        #scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            column-gap: 2px;
            width: 101%; /* If I only do 100% there's a weird tiny gap on the right side so this works for now */
        }

        .scriptureIcon {
            max-width: 100%;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div class="imgContainer">
            <img src="images/jesus_feeds_5000.jpeg" alt="Jesus feeds the 5000" id="title-bg">
        </div>
        <div id="title-box">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit" class="submitBtn">Submit</button>
            </section>
        </form>
        <div id="scriptures">
            <img src="images/old_testament.webp" alt="Old Testament" class="scriptureIcon">
            <img src="images/new_testament.webp" alt="New Testament" class="scriptureIcon">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon" class="scriptureIcon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants" class="scriptureIcon">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price" class="scriptureIcon">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
