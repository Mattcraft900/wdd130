<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Brad R. Wilcox</td>
            <td>His Grace is Sufficient</td>
            <td>BYU</td>
            <td>2011</td>
          </tr>
          <tr>
            <td>Henry B. Eyring</td>
            <td>A Law of Increasing Returns</td>
            <td>BYU</td>
            <td>1982</td>
          </tr>
          <tr>
            <td>Jeffrey R. and Patricia T. Holland</td>
            <td>The Inconvenient Messiah</td>
            <td>BYU</td>
            <td>1982</td>
          </tr>
        </table>
        <h2 id="form-title">Add Another Devotional:</h2>
        <form action="">
          <div class="input-field">
            <label for="devo-speaker">Speaker:</label><br>
            <input type="text" id="devo-speaker" name="devo-speaker">
          </div>
          <div class="input-field">
            <label for="devo-title">Title:</label>
          <input type="text" id="devo-title" name="devo-title">
          </div>
          <div class="input-field">
            <label for="devo-location">Location:</label>
            <input type="text" id="devo-location" name="devo-location">
          </div>
          <div class="input-field">
            <label for="devo-year">Year:</label>
            <input type="text" id="devo-year" name="devo-year">
          </div>
          <input class="submit-button" type="submit" value="Add">
        </form>
      </div>

    </main>
  </div>
</body>

</html>
