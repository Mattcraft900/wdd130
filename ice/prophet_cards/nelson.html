<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        * {
            box-sizing: border-box;
            padding: 0px;
            margin: 0px;
        }
        body {
            background: #FFECD7;
        }
        .card {
            width: 400px;
            height: auto;
            background-color: #008DB1;
            border-style: solid;
            border-color: #004E63;
            border-width: 4px solid;
            border-radius: 28px;
            padding: 30px;
            padding-bottom: 50px;
            margin: 30px auto;
            font-family: Helvetica, sans-serif;
            text-align: center;
        }
        .card a {
            text-decoration: none;
        }
        #card-title {
            color: #FFFFFE;
            font-size: 38px;
        }
        #card-subtitle {
            color: #91E4FB;
            margin: 10px;
            font-size: 18px;
        }
        #photo {
            max-width: 75%;
            height: auto;
            border-style: solid;
            border-width: 4px;
            border-color: #FFFFFE;
            margin: 5px 0px;
        }
        #card-stats {
            width: 190px;
            margin: 5px auto;
            text-align: left;
            color: #FFFFFE;
            font-size: 1.2em;
            line-height: 1.4em;
        }
        .quote {
            color: #FFD783;
            font-family: "Brush Script MT", Helvetica, sans-serif;
            line-height: 2em;
            max-width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <main>
        <section class="card">
            <h1 id="card-title">Russell M. Nelson</h1>
            <a href="https://www.churchofjesuschrist.org/" target="_blank">
                <p id="card-subtitle">17th President of the Church of Jesus Christ of Latter-day Saints</p>
                <!-- The "The" in fornt of the Church's name should capitalized btw, if you care about that -->
            </a>
            <img id="photo" src="images/russell_nelson.png" alt="Russell M. Nelson">
            <ul id="card-stats">
                <li>Born: Sep 9, 1924</li>
                <li>Apostle: Apr 7, 1984</li>
                <li>Prophet: Jan 14, 2018</li>
            </ul>
            <blockquote class="quote" cite="https://www.churchofjesuschrist.org/study/general-conference/2024/10/57nelson?lang=eng#:~:text=I%20urge%20you%20to%20devote%20time%20each%20week%E2%80%94for%20the%20rest%20of%20your%20life%E2%80%94to%20increase%20your%20understanding%20of%20the%20Atonement%20of%20Jesus%20Christ.">
                "I urge you to devote time each week — for the rest of your life — to increase your understanding of the Atonement of Jesus Christ."
            </blockquote>
        </section>
    </main>
</body>
</html>
